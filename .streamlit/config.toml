[theme]
base = "dark"
primaryColor = "#0096c7"
backgroundColor = "#141822"
secondaryBackgroundColor = "#1c2434"
textColor = "#d8e2ec"
font = "sans serif"

[theme.sidebar]
backgroundColor = "#161c28"
textColor = "#c8d4e2"

[browser]
gatherUsageStats = false

[server]
enableCORS = false
enableXsrfProtection = true
fileWatcherType = "none"
runOnSave = false
maxMessageSize = 50
enableWebsocketCompression = true

[client]
showErrorDetails = false
toolbarMode = "minimal"
